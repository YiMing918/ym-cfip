name: 聚合优选 IP 数据

on:
  schedule:
    - cron: "20 */2 * * *"   # 每 2 小时（UTC 分钟偏移避开整点高峰）
  workflow_dispatch:          # 也可在 Actions 页手动触发

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取并聚合
        run: python scripts/aggregate.py
      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 自动聚合 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
