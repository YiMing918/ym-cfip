name: 聚合优选 IP 数据

on:
  schedule:
    - cron: "20 */2 * * *"   # 每 2 小时（UTC 分钟偏移避开整点高峰）
  workflow_dispatch:          # 也可在 Actions 页手动触发

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取并聚合
        run: python scripts/aggregate.py
      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 自动聚合 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
      # 可选：直传型 Pages 项目（未连 Git）可用部署令牌自动推送更新。
      # 需在仓库 Settings → Secrets 添加 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID；
      # 没配令牌时本步自动跳过，不影响聚合与提交（Fork 用户无感）。
      - name: 推送部署到 Cloudflare Pages（仅当配了部署令牌）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          mkdir -p dist/data dist/functions
          cp index.html _headers dist/
          cp -r data/. dist/data/
          cp functions/sub.js dist/functions/
          npx -y wrangler@3 pages deploy dist --project-name ym-cfip --branch main --commit-dirty=true
