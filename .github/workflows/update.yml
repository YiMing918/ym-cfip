name: 聚合优选 IP 数据

on:
  schedule:
    - cron: "20 */2 * * *"   # 每 2 小时（UTC 分钟偏移避开整点高峰）
  workflow_dispatch:          # 也可在 Actions 页手动触发

permissions:
  contents: write

# 定时与手动/看门狗派发可能撞车：同组串行排队，避免两轮同时聚合后裸 push 互相顶掉
concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEICE_KEY: ${{ secrets.WEICE_KEY }}
      HOSTMONIT_KEY: ${{ secrets.HOSTMONIT_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 抓取并聚合
        run: python scripts/aggregate.py
      - name: 有变化才提交
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 自动聚合 $(date +'%Y-%m-%d %H:%M')"
            pushed=0
            for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" -lt 3 ]; then echo "push 失败，10 秒后重试（第 $i 次）"; sleep 10; fi
            done
            if [ "$pushed" != "1" ]; then echo "::error::push 重试 3 次仍失败"; exit 1; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # 可选：直传型 Pages 项目（未连 Git）可用部署令牌自动推送更新。
      # 需在仓库 Settings → Secrets 添加 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID；
      # 没配令牌时本步自动跳过，不影响聚合与提交（Fork 用户无感）。
      # 部署工具 wrangler 走仓库锁文件（package-lock.json）钉死版本，不现拉最新版，
      # 避免工具半夜升版把部署顶坏；下面两步与部署步同一条件，没配令牌时一并跳过。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && steps.commit.outputs.changed == 'true' }}
        with:
          node-version: '22'
      - name: 按锁文件装部署工具
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && steps.commit.outputs.changed == 'true' }}
        run: npm ci --no-audit --no-fund
      - name: 推送部署到 Cloudflare Pages（仅当配了部署令牌）
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && steps.commit.outputs.changed == 'true' }}
        run: |
          mkdir -p dist/data dist/functions
          cp index.html _headers dist/
          cp -r data/. dist/data/
          cp -r functions/. dist/functions/
          npx -y wrangler pages deploy dist --project-name ym-cfip --branch main --commit-dirty=true

      - name: 心跳保活（防 GitHub 60 天无活动停用定时任务）
        # 不用 if: always()：聚合步骤失败时心跳提交会把失败轮伪装成有活动，
        # 让坏掉的管线看起来还活着；默认 success() 门控即可（无变化跳过提交算成功）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 25 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
            git add .heartbeat
            git commit -m "heartbeat: 保活定时任务"
            pushed=0
            for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$i" -lt 3 ]; then echo "push 失败，10 秒后重试（第 $i 次）"; sleep 10; fi
            done
            if [ "$pushed" != "1" ]; then echo "::error::push 重试 3 次仍失败"; exit 1; fi
          else
            echo "仓库近期有活动，无需心跳提交"
          fi
